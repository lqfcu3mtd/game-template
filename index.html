<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>砖块消消乐 · 小游戏模板</title>
<style>
  :root {
    --bg: #eef2f7;
    --panel: #ffffff;
    --text: #1f2933;
    --accent: #4f7cff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 100vh; padding: 20px;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: #6b7280; font-size: 13px; margin-bottom: 16px; }
  .game-wrap {
    background: var(--panel);
    border-radius: 16px;
    box-shadow: 0 12px 40px rgba(15,23,42,.15);
    padding: 16px;
  }
  .hud {
    display: flex; justify-content: space-between;
    margin-bottom: 12px; font-size: 14px; font-weight: 600;
  }
  .hud b { color: var(--accent); font-size: 16px; }
  .stage { position: relative; }
  canvas { display: block; border-radius: 10px; background: #0f172a; touch-action: none; cursor: none; }
  .overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(15,23,42,.72); border-radius: 10px;
    transition: opacity .2s;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .panel { text-align: center; color: #e5e7eb; padding: 24px; max-width: 80%; }
  .panel h2 { font-size: 26px; margin-bottom: 10px; }
  .panel p { font-size: 14px; opacity: .85; margin-bottom: 16px; line-height: 1.6; }
  .panel .hint { font-size: 12px; opacity: .6; margin-top: 14px; margin-bottom: 0; }
  button {
    border: none; cursor: pointer;
    background: var(--accent); color: #fff;
    font-size: 16px; font-weight: 600;
    padding: 11px 28px; border-radius: 10px;
    transition: transform .1s, background .2s;
  }
  button:hover { background: #3b66e0; }
  button:active { transform: scale(.96); }
</style>
</head>
<body>
  <h1>砖块消消乐</h1>
  <div class="sub">一个开箱即用的 HTML5 小游戏模板 · 单文件 · 零依赖</div>

  <div class="game-wrap">
    <div class="hud">
      <span>分数 <b id="score">0</b></span>
      <span>关卡 <b id="level">1</b></span>
      <span>生命 <b id="lives">3</b></span>
    </div>
    <div class="stage">
      <canvas id="game" width="760" height="460"></canvas>
      <div class="overlay" id="overlay">
        <div class="panel">
          <h2 id="ov-title">砖块消消乐</h2>
          <p id="ov-text">用鼠标或 ←/→ 移动挡板，接住小球消除所有砖块</p>
          <button id="ov-btn">开始游戏</button>
          <p class="hint">空格 暂停 / 继续 · R 重新开始</p>
        </div>
      </div>
    </div>
  </div>

<script>
(function () {
  "use strict";

  // ===== 画布与常量 =====
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;

  const STATE = { MENU: 0, PLAYING: 1, PAUSED: 2, OVER: 3, WIN: 4 };

  const BRICK = { cols: 10, rows: 5, h: 22, gap: 6, top: 56, sideMargin: 24 };
  const BRICK_COLORS = ["#ef4444", "#f59e0b", "#eab308", "#22c55e", "#3b82f6"];

  // ===== 游戏状态 =====
  const game = {
    state: STATE.MENU,
    score: 0,
    lives: 3,
    level: 1,
    bricksLeft: 0,
  };

  const paddle = { w: 110, h: 14, x: 0, y: H - 36, speed: 9 };
  const ball = { x: 0, y: 0, r: 8, dx: 0, dy: 0, speed: 5 };
  let bricks = [];
  let particles = [];

  // ===== 输入 =====
  const keys = { left: false, right: false };
  let useMouse = false;

  document.addEventListener("keydown", (e) => {
    if (e.code === "ArrowLeft") keys.left = true;
    if (e.code === "ArrowRight") keys.right = true;
    if (e.code === "Space") { e.preventDefault(); togglePause(); }
    if (e.code === "KeyR") resetGame();
  });
  document.addEventListener("keyup", (e) => {
    if (e.code === "ArrowLeft") keys.left = false;
    if (e.code === "ArrowRight") keys.right = false;
  });
  canvas.addEventListener("mousemove", (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (W / rect.width);
    paddle.x = clamp(mx - paddle.w / 2, 0, W - paddle.w);
    useMouse = true;
  });

  // ===== UI =====
  const overlay = document.getElementById("overlay");
  const ovTitle = document.getElementById("ov-title");
  const ovText = document.getElementById("ov-text");
  const ovBtn = document.getElementById("ov-btn");

  ovBtn.addEventListener("click", () => {
    if (game.state === STATE.MENU || game.state === STATE.OVER || game.state === STATE.WIN) {
      resetGame();
    } else if (game.state === STATE.PAUSED) {
      togglePause();
    }
  });

  function showOverlay(title, text, btn) {
    ovTitle.textContent = title;
    ovText.textContent = text;
    ovBtn.textContent = btn;
    overlay.classList.remove("hidden");
  }
  function hideOverlay() { overlay.classList.add("hidden"); }

  // ===== 工具函数 =====
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  function buildBricks() {
    bricks = [];
    const usableW = W - BRICK.sideMargin * 2;
    const bw = (usableW - BRICK.gap * (BRICK.cols - 1)) / BRICK.cols;
    const rows = Math.min(BRICK.rows + game.level - 1, BRICK_COLORS.length);
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < BRICK.cols; c++) {
        bricks.push({
          x: BRICK.sideMargin + c * (bw + BRICK.gap),
          y: BRICK.top + r * (BRICK.h + BRICK.gap),
          w: bw, h: BRICK.h,
          color: BRICK_COLORS[r],
          alive: true,
        });
      }
    }
    game.bricksLeft = bricks.length;
  }

  function resetBall() {
    ball.x = W / 2;
    ball.y = paddle.y - ball.r - 2;
    ball.speed = 5 + (game.level - 1) * 0.6;
    const angle = (-Math.PI / 4) - Math.random() * (Math.PI / 4); // 向上偏左/右
    ball.dx = ball.speed * Math.sin(angle);
    ball.dy = -ball.speed * Math.cos(angle);
  }

  function resetGame() {
    game.state = STATE.PLAYING;
    game.score = 0;
    game.lives = 3;
    game.level = 1;
    paddle.x = (W - paddle.w) / 2;
    buildBricks();
    resetBall();
    updateHud();
    hideOverlay();
  }

  function nextLevel() {
    game.level++;
    paddle.x = (W - paddle.w) / 2;
    buildBricks();
    resetBall();
    updateHud();
  }

  function togglePause() {
    if (game.state === STATE.PLAYING) {
      game.state = STATE.PAUSED;
      showOverlay("已暂停", "休息一下，随时回来", "继续游戏");
    } else if (game.state === STATE.PAUSED) {
      game.state = STATE.PLAYING;
      hideOverlay();
    }
  }

  function loseLife() {
    game.lives--;
    updateHud();
    if (game.lives <= 0) {
      game.state = STATE.OVER;
      showOverlay("游戏结束", "最终得分 " + game.score + " · 再来一局？", "重新开始");
    } else {
      resetBall();
    }
  }

  function spawnParticles(x, y, color) {
    for (let i = 0; i < 8; i++) {
      particles.push({
        x, y,
        dx: (Math.random() - 0.5) * 6,
        dy: (Math.random() - 0.5) * 6,
        life: 1, color,
      });
    }
  }

  function updateHud() {
    document.getElementById("score").textContent = game.score;
    document.getElementById("level").textContent = game.level;
    document.getElementById("lives").textContent = game.lives;
  }

  // ===== 逻辑更新 =====
  function update() {
    if (game.state !== STATE.PLAYING) return;

    // 挡板键盘移动
    if (keys.left) paddle.x -= paddle.speed;
    if (keys.right) paddle.x += paddle.speed;
    paddle.x = clamp(paddle.x, 0, W - paddle.w);

    // 小球移动
    ball.x += ball.dx;
    ball.y += ball.dy;

    // 墙壁碰撞
    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.dx = Math.abs(ball.dx); }
    if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.dx = -Math.abs(ball.dx); }
    if (ball.y - ball.r < 0) { ball.y = ball.r; ball.dy = Math.abs(ball.dy); }
    if (ball.y + ball.r > H) { loseLife(); return; }

    // 挡板碰撞
    if (ball.dy > 0 &&
        ball.y + ball.r >= paddle.y &&
        ball.y - ball.r <= paddle.y + paddle.h &&
        ball.x >= paddle.x && ball.x <= paddle.x + paddle.w) {
      const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2); // -1..1
      const maxBounce = Math.PI / 3;
      const angle = hit * maxBounce;
      ball.dx = ball.speed * Math.sin(angle);
      ball.dy = -ball.speed * Math.cos(angle);
      ball.y = paddle.y - ball.r - 0.5;
    }

    // 砖块碰撞
    for (let i = 0; i < bricks.length; i++) {
      const b = bricks[i];
      if (!b.alive) continue;
      if (ball.x + ball.r < b.x || ball.x - ball.r > b.x + b.w ||
          ball.y + ball.r < b.y || ball.y - ball.r > b.y + b.h) continue;
      const prevX = ball.x - ball.dx, prevY = ball.y - ball.dy;
      if (prevX <= b.x || prevX >= b.x + b.w) ball.dx = -ball.dx;
      else ball.dy = -ball.dy;
      b.alive = false;
      game.bricksLeft--;
      game.score += 10 * game.level;
      spawnParticles(ball.x, ball.y, b.color);
      updateHud();
      break;
    }

    // 过关
    if (game.bricksLeft <= 0) {
      if (game.level >= 5) {
        game.state = STATE.WIN;
        showOverlay("通关啦！", "最终得分 " + game.score + " · 你真厉害", "再玩一次");
      } else {
        nextLevel();
      }
    }

    // 粒子更新
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.dx; p.y += p.dy; p.life -= 0.04;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  // ===== 渲染 =====
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function render() {
    ctx.clearRect(0, 0, W, H);

    // 砖块
    for (const b of bricks) {
      if (!b.alive) continue;
      ctx.fillStyle = b.color;
      roundRect(b.x, b.y, b.w, b.h, 5);
      ctx.fill();
    }

    // 挡板
    ctx.fillStyle = "#e2e8f0";
    roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7);
    ctx.fill();

    // 小球
    ctx.beginPath();
    ctx.fillStyle = "#ffffff";
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fill();

    // 粒子
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;
  }

  // ===== 主循环 =====
  function loop() {
    update();
    render();
    requestAnimationFrame(loop);
  }

  // 初始菜单
  showOverlay("砖块消消乐", "用鼠标或 ←/→ 移动挡板，接住小球消除所有砖块", "开始游戏");
  loop();
})();
</script>
</body>
</html>
